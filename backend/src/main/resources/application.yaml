server:
  servlet:
    context-path: /promptvault

spring:
  profiles:
    active: localhost
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: prompt-vault
  sql:
    init:
      mode: never

  flyway:
    enabled: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 604800000 # 7 days in milliseconds
  mail:
    from: ${MAIL_FROM:noreply@promptvault.app}
    base-url: ${APP_BASE_URL:http://localhost:5173}
