spring:
  profiles:
    active: localhost
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql.woods.local:5432/prompt-vault-dev}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: prompt-vault
  sql:
    init:
      mode: never

  flyway:
    enabled: true
