services:
  db:
    image: postgres:17-alpine
    container_name: promptvault-db
    environment:
      POSTGRES_DB: promptvault
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: promptvault-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/promptvault
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_SQL_INIT_PLATFORM: postgres
    depends_on:
      - db

volumes:
  postgres_data:
